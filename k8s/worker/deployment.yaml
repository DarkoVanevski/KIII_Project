apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: invoices
  labels:
    app: invoices
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoices
      component: worker
  template:
    metadata:
      labels:
        app: invoices
        component: worker
    spec:
      containers:
        - name: worker
          image: vanevskidarko/kiii-invoices-app:latest
          imagePullPolicy: Always
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
