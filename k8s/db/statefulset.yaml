apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: invoices
  labels:
    app: invoices
    component: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: invoices
      component: db
  template:
    metadata:
      labels:
        app: invoices
        component: db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-secret
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: db-data
        labels:
          app: invoices
          component: db
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName set - uses the cluster's default StorageClass
        resources:
          requests:
            storage: 2Gi
