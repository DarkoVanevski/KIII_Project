# Demo secret for a course project - not production-grade secret management.
# In a real deployment these would come from a secret manager / sealed-secrets,
# not be committed to git in plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: invoices
  labels:
    app: invoices
    component: db
type: Opaque
stringData:
  MYSQL_USER: invoices
  MYSQL_PASSWORD: dev-db-password-change-me
  MYSQL_ROOT_PASSWORD: dev-root-password-change-me
