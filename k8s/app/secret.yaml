# Demo secret for a course project - not production-grade secret management.
# DB_USERNAME/DB_PASSWORD must match k8s/db/secret.yaml's MYSQL_USER/MYSQL_PASSWORD.
# APP_KEY: generate your own with `php artisan key:generate --show` and replace this.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: invoices
  labels:
    app: invoices
    component: app
type: Opaque
stringData:
  APP_KEY: base64:BtDduxqz4IklUVcmx5KlRMYVjyQb75e3qAAzUMxwgCE=
  DB_USERNAME: invoices
  DB_PASSWORD: dev-db-password-change-me
