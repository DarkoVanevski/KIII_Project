apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: invoices
  labels:
    app: invoices
    component: app
data:
  APP_NAME: "Invoice App"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://invoices.local
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: invoices
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  MAIL_MAILER: log
